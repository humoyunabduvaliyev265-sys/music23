<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="60%" stop-color="#11121d" />
      <stop offset="90%" stop-color="#1f2138" />
      <stop offset="100%" stop-color="#0c0d14" />
    </radialGradient>
  </defs>

  <!-- Background rounded rectangle (for standard icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Disc Body -->
  <circle cx="256" cy="256" r="180" fill="url(#discGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Disc Center / Core Label -->
  <circle cx="256" cy="256" r="70" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
  <circle cx="256" cy="256" r="22" fill="#0c0d14" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />

  <!-- Modern Music / Sound Wave Overlay inside center -->
  <path d="M 230 256 A 26 26 0 0 1 282 256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  
  <!-- Subtle glass shine reflection -->
  <path d="M 120 120 A 180 180 0 0 1 392 120 L 256 256 Z" fill="url(#glowGrad)" opacity="0.3" pointer-events="none" />
</svg>
