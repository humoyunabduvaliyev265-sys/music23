<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="discGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="60%" stop-color="#11121d" />
      <stop offset="90%" stop-color="#1f2138" />
      <stop offset="100%" stop-color="#0c0d14" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable (Android clips this to circle or squircle) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Disc Body positioned inside safe zone (inner 75% = radius 145) -->
  <circle cx="256" cy="256" r="145" fill="url(#discGradMask)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Disc Center / Core Label -->
  <circle cx="256" cy="256" r="56" fill="url(#bgGradMask)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
  <circle cx="256" cy="256" r="18" fill="#0c0d14" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
</svg>
